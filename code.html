function formatDate(d){
  if(!d) return "—";
  const date = new Date(d + "T00:00:00");
  return date.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
}
function imgOrPlaceholder(images, index, alt){
  if(images && images.length > 0){
    return `<img src="${images[index]}" alt="${esc(alt)}">`;
  }
  return `<div class="no-img">${Icon.imgPlus}<span>Photo coming soon</span></div>`;
}
function esc(str){
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}
function friendlyAuthError(err, mode){
  const code = err.code || "";
  if(mode === "login" && (code === "auth/user-not-found" || code === "auth/invalid-credential" || code === "auth/wrong-password")){
    return "We couldn't log you in with that email and password. If you don't have an account yet, sign up below first.";
  }
  if(code === "auth/email-already-in-use"){
    return "That email already has an account — try logging in instead.";
  }
  if(code === "auth/weak-password"){
    return "Please use a password with at least 6 characters.";
  }
  if(code === "auth/invalid-email"){
    return "That doesn't look like a valid email address.";
  }
  if(code === "auth/too-many-requests"){
    return "Too many attempts — please wait a moment and try again.";
  }
  return err.message || "Something went wrong.";
}
function initials(name){
  if(!name) return "?";
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}

/* ---------------- shrink photos before they go in a Firestore doc ---------------- */
function resizeImage(file, maxWidth = 900, quality = 0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = ()=> reject(new Error("Could not read image"));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}

/* ---------------- auth ---------------- */
auth.onAuthStateChanged(async (user)=>{
  authReady = true;
  authUser = user;
  state.menuOpen = false;

  if(unsubBookingsAsRenter){ unsubBookingsAsRenter(); unsubBookingsAsRenter=null; }
  if(unsubBookingsAsOwner){ unsubBookingsAsOwner(); unsubBookingsAsOwner=null; }
  bookingsAsRenter = [];
  bookingsAsOwner = [];

  if(!user){
    userProfile = null;
    profileReady = true;
    activeRole = null;
    showRoleModal = false;
    state.view = "home";
    render();
    return;
  }

  profileReady = false;
  render();

  try{
    const doc = await usersCollection.doc(user.uid).get();
    if(doc.exists){
      userProfile = doc.data();
    }else{
      userProfile = { name: user.displayName || (user.email ? user.email.split("@")[0] : "Neighbour"), email: user.email || "", role: null };
      await usersCollection.doc(user.uid).set(userProfile, { merge:true });
    }
    activeRole = userProfile.role || null;
    showRoleModal = !activeRole;
    state.view = activeRole === "host" ? "myListings" : "home";
    profileReady = true;
    if(activeRole) subscribeBookings(user.uid);
    render();
  }catch(err){
    console.error("Could not load profile:", err);
    profileReady = true;
    render();
  }
});

async function chooseRole(role){
  if(!authUser) return;
  try{
    await usersCollection.doc(authUser.uid).set({ role }, { merge:true });
    userProfile = { ...(userProfile||{}), role };
    activeRole = role;
    showRoleModal = false;
    state.view = role === "host" ? "myListings" : "home";
    subscribeBookings(authUser.uid);
    render();
  }catch(err){
    console.error("Could not save role:", err);
    alert("Couldn't save that choice — check your connection and try again.");
  }
}

function switchRole(){
  const next = activeRole === "host" ? "user" : "host";
  chooseRole(next);
}

function subscribeBookings(uid){
  unsubBookingsAsRenter = bookingsCollection.where("renterUid","==",uid).onSnapshot((snap)=>{
    bookingsAsRenter = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    bookingsAsRenter.sort((a,b)=> (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    render();
  }, (err)=> console.error("Could not load rentals:", err));

  unsubBookingsAsOwner = bookingsCollection.where("ownerUid","==",uid).onSnapshot((snap)=>{
    bookingsAsOwner = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    bookingsAsOwner.sort((a,b)=> (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    render();
  }, (err)=> console.error("Could not load requests:", err));
}

/* ---------------- persistence (Firestore products) ---------------- */
function loadProducts(){
  productsCollection
    .orderBy("createdAt", "desc")
    .onSnapshot(
      (snapshot)=>{
        products = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data({ serverTimestamps: "estimate" })
        }));
        storageReady = true;
        storageError = false;
        render();
      },
      (err)=>{
        console.error("Could not load listings:", err);
        storageReady = true;
        storageError = true;
        render();
      }
    );
}

/* ---------------- render ---------------- */
function render(){
  const app = document.getElementById("app");
  let html = "";

  if(!authReady || (authUser && !profileReady) || !storageReady){
    app.innerHTML = `<div class="empty">Loading…</div>`;
    return;
  }

  if(!authUser){
    html += renderAuthHeader();
    html += renderAuthScreen();
    html += `<footer>Padosi is a demo peer-to-peer rental marketplace.</footer>`;
    app.innerHTML = html;
    attachAuthEvents();
    return;
  }

  // route guarding by role
  const userViews = ["home","detail","myRentals"];
  const hostViews = ["add","myListings","requests"];
  if(activeRole === "user" && hostViews.includes(state.view)) state.view = "home";
  if(activeRole === "host" && userViews.includes(state.view)) state.view = "myListings";

  html += renderHeader();
  if(activeRole === "user" && state.view === "home") html += renderChips();

  if(activeRole === "user" && state.view === "home") html += renderGrid();
  if(activeRole === "user" && state.view === "detail") html += renderDetail();
  if(activeRole === "user" && state.view === "myRentals") html += renderMyRentals();
  if(activeRole === "host" && state.view === "add") html += renderForm();
  if(activeRole === "host" && state.view === "myListings") html += renderMyListings();
  if(activeRole === "host" && state.view === "requests") html += renderRequests();

  if(storageError){
    html += `<div class="wrap" style="text-align:center;color:var(--muted);font-size:12px;padding:8px 20px 0;">Couldn't reach the database right now — check your Firebase config and internet connection.</div>`;
  }

  html += `<footer>Padosi is a demo peer-to-peer rental marketplace.</footer>`;

  if(showRoleModal) html += renderRoleModal();

  app.innerHTML = html;
  attachEvents();
}

function renderChips(){
  return `
  <div class="chips">
    ${CATEGORIES.map(c => `<button class="chip ${c===state.activeCategory?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
  </div>`;
}

function getFiltered(){
  const q = state.query.trim().toLowerCase();
  return products.filter(p=>{
    const matchesCat = state.activeCategory==="All" || p.category===state.activeCategory;
    const matchesQ = !q || p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.location.toLowerCase().includes(q);
    return matchesCat && matchesQ;
  });
}

function renderGrid(){
  const list = getFiltered();
  if(list.length===0){
    const noneAtAll = products.length===0;
    return `<div class="empty">
      ${noneAtAll
        ? `No listings yet. Check back soon.`
        : `Nothing matches that search yet. Try another word.`}
    </div>`;
  }
  return `
  <div class="grid">
    ${list.map(p=>`
      <button class="card" data-open="${p.id}">
        <div class="card-img">${imgOrPlaceholder(p.images, 0, p.title)}</div>
        <div class="card-body">
          <div class="card-cat">${esc(p.category)}</div>
          <div class="card-title serif">${esc(p.title)}</div>
          <div class="card-foot">
            <div class="card-price">${Icon.rupee}${p.price}<span>/day</span></div>
            <div class="card-until">${Icon.calendar} till ${formatDate(p.availableUntil)}</div>
          </div>
        </div>
      </button>
    `).join("")}

        </div>
        <div>
          <label>Refundable deposit (₹)</label>
          <input type="number" min="0" id="fDeposit" placeholder="2000" value="${editing?.deposit ?? ""}">

/* ---------------- events: auth screen ---------------- */
function attachAuthEvents(){
  const switchLink = document.getElementById("authSwitchLink");
  if(switchLink) switchLink.onclick = (e)=>{
    e.preventDefault();
    state.authMode = state.authMode==="login" ? "signup" : "login";
    state.authError = "";
    render();
  };

  const googleBtn = document.getElementById("googleBtn");
  if(googleBtn) googleBtn.onclick = async ()=>{
    state.authError = "";
    try{
      await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    }catch(err){
      console.error(err);
      state.authError = err.message || "Google sign-in failed.";
      render();
    }
  };

  const authForm = document.getElementById("authForm");
  if(authForm){
    authForm.onsubmit = async (e)=>{
      e.preventDefault();
      const email = document.getElementById("fEmail").value.trim();
      const password = document.getElementById("fPassword").value;
      const nameEl = document.getElementById("fName");
      const name = nameEl ? nameEl.value.trim() : "";

      state.authError = "";
      if(!email || !password){
        state.authError = "Please fill in email and password.";
        render();
        return;
      }
      if(state.authMode==="signup" && !name){
        state.authError = "Please tell us your name.";
        render();
        return;
      }

      state.authBusy = true;
      render();
      try{
        if(state.authMode==="signup"){
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await cred.user.updateProfile({ displayName: name });
          await usersCollection.doc(cred.user.uid).set({ name, email, role: null }, { merge:true });
        }else{
          await auth.signInWithEmailAndPassword(email, password);
        }
      }catch(err){
        console.error(err);
        state.authError = friendlyAuthError(err, state.authMode);
        state.authBusy = false;
        render();
      }
    };
  }
}

/* ---------------- events: main app ---------------- */
function attachEvents(){
  const logoBtn = document.getElementById("logoBtn");
  if(logoBtn) logoBtn.onclick = ()=>{ state.view = activeRole==="host" ? "myListings" : "home"; render(); };

  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.onclick = ()=>{ state.view = activeRole==="host" ? "myListings" : "home"; state.selectedId=null; render(); };

  document.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.onclick = ()=>{ state.view = btn.getAttribute("data-nav"); render(); };
  });

  const addBtn = document.getElementById("addBtn");
  if(addBtn) addBtn.onclick = ()=>{ state.view="add"; state.editingId=null; state.formImages=[]; render(); };

  const accountBtn = document.getElementById("accountBtn");
  if(accountBtn) accountBtn.onclick = (e)=>{ e.stopPropagation(); state.menuOpen = !state.menuOpen; render(); };

  const switchRoleBtn = document.getElementById("switchRoleBtn");
  if(switchRoleBtn) switchRoleBtn.onclick = ()=>{ state.menuOpen=false; switchRole(); };

  const logoutBtn = document.getElementById("logoutBtn");
  if(logoutBtn) logoutBtn.onclick = ()=>{ state.menuOpen=false; auth.signOut(); };

  if(state.menuOpen){
    document.addEventListener("click", closeMenuOnce, { once:true });
  }

  const roleUserBtn = document.getElementById("roleUserBtn");
  if(roleUserBtn) roleUserBtn.onclick = ()=> chooseRole("user");
  const roleHostBtn = document.getElementById("roleHostBtn");
  if(roleHostBtn) roleHostBtn.onclick = ()=> chooseRole("host");

  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.oninput = (e)=>{
      state.query = e.target.value;
      const cursorPos = e.target.selectionStart;
      render();
      const freshInput = document.getElementById("searchInput");
      if(freshInput){
        freshInput.focus();
        freshInput.setSelectionRange(cursorPos, cursorPos);
      }
    };
  }

  document.querySelectorAll("[data-cat]").forEach(btn=>{
    btn.onclick = ()=>{ state.activeCategory = btn.getAttribute("data-cat"); render(); };
  });

  document.querySelectorAll("[data-open]").forEach(btn=>{
    btn.onclick = ()=>{ state.selectedId = btn.getAttribute("data-open"); state.view="detail"; state.activeImg=0; render(); window.scrollTo(0,0); };
  });

  document.querySelectorAll("[data-thumb]").forEach(t=>{
    t.onclick = ()=>{ state.activeImg = Number(t.getAttribute("data-thumb")); render(); };
  });

  const requestBtn = document.getElementById("requestBtn");
  if(requestBtn) requestBtn.onclick = ()=> requestToRent(requestBtn.getAttribute("data-pid"));

  document.querySelectorAll("[data-cancel]").forEach(btn=>{
    btn.onclick = ()=> cancelBooking(btn.getAttribute("data-cancel"));
  });
  document.querySelectorAll("[data-approve]").forEach(btn=>{
    btn.onclick = ()=> updateBookingStatus(btn.getAttribute("data-approve"), "approved");
  });
  document.querySelectorAll("[data-reject]").forEach(btn=>{
    btn.onclick = ()=> updateBookingStatus(btn.getAttribute("data-reject"), "rejected");
  });

  document.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.onclick = ()=>{
      state.editingId = btn.getAttribute("data-edit");
      const p = products.find(x=>x.id===state.editingId);
      state.formImages = p ? p.images.slice() : [];
      state.view = "add";
      render();
    };
  });
  document.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.onclick = ()=> deleteListing(btn.getAttribute("data-delete"));
  });

  const imgAddBtn = document.getElementById("imgAddBtn");
  const fileInput = document.getElementById("fileInput");
  if(imgAddBtn && fileInput){
    imgAddBtn.onclick = ()=> fileInput.click();
    fileInput.onchange = async (e)=>{
      const files = Array.from(e.target.files).slice(0, 4-state.formImages.length);
      for(const file of files){
        try{
          const dataUrl = await resizeImage(file);
          state.formImages.push(dataUrl);
          render();
        }catch(err){
          console.error("Could not process image:", err);
        }
      }
    };
  }

  document.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.onclick = ()=>{
      const i = Number(btn.getAttribute("data-remove"));
      state.formImages.splice(i,1);
      render();
    };
  });

  const addForm = document.getElementById("addForm");
  if(addForm){
    addForm.onsubmit = async (e)=>{
      e.preventDefault();
      const title = document.getElementById("fTitle").value.trim();
      const price = document.getElementById("fPrice").value;
      const until = document.getElementById("fUntil").value;
      const errorEl = document.getElementById("formError");
      const submitBtn = addForm.querySelector(".btn-publish");

      if(!title || !price || !until || state.formImages.length===0){
        errorEl.textContent = "Please add a title, daily rent, a closing date, and at least one photo.";
        errorEl.style.display = "block";
        return;
      }

      const productData = {
        title,
        category: document.getElementById("fCategory").value,
        price: Number(price),
        deposit: Number(document.getElementById("fDeposit").value) || 0,
        condition: document.getElementById("fCondition").value,
        location: document.getElementById("fLocation").value.trim() || "Location not specified",
        availableUntil: until,
        description: document.getElementById("fDescription").value.trim() || "No description provided.",
        ownerUid: authUser.uid,
        ownerName: userProfile?.name || authUser.email || "Host",
        ownerConditions: document.getElementById("fConditions").value.trim() || "No special conditions specified.",
        images: state.formImages.slice()
      };

      errorEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Saving…";

      try{
        if(state.editingId){
          await productsCollection.doc(state.editingId).update(productData);
        }else{
          await productsCollection.add({ ...productData, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        }
        state.editingId = null;
        state.view = "myListings";
        render();
      }catch(err){
        console.error("Could not save listing:", err);
        errorEl.textContent = "Couldn't save this listing — check your Firebase config/rules, or try fewer or smaller photos.";
        errorEl.style.display = "block";
      }finally{
        submitBtn.disabled = false;
        submitBtn.innerHTML = `${Icon.upload} ${state.editingId ? "Save changes" : "Publish listing"}`;
      }
    };
  }
}

function closeMenuOnce(){
  state.menuOpen = false;
  render();
}

/* ---------------- booking actions ---------------- */
async function requestToRent(productId){
  const p = products.find(x=>x.id===productId);
  if(!p || !authUser) return;
  try{
    await bookingsCollection.add({
      productId: p.id,
      productTitle: p.title,
      productImage: p.images && p.images[0] ? p.images[0] : null,
      price: p.price,
      renterUid: authUser.uid,
      renterName: userProfile?.name || authUser.email || "Renter",
      ownerUid: p.ownerUid,
      ownerName: p.ownerName,
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    state.view = "myRentals";
    render();
  }catch(err){
    console.error("Could not send request:", err);
    alert("Couldn't send that request — please try again.");
  }
}

async function cancelBooking(id){
  if(!confirm("Cancel this rental request?")) return;
  try{ await bookingsCollection.doc(id).delete(); }
  catch(err){ console.error(err); alert("Couldn't cancel — please try again."); }
}

async function updateBookingStatus(id, status){
  try{ await bookingsCollection.doc(id).update({ status }); }
  catch(err){ console.error(err); alert("Couldn't update that request — please try again."); }
}

async function deleteListing(id){
  if(!confirm("Delete this listing? This can't be undone.")) return;
  try{ await productsCollection.doc(id).delete(); }
  catch(err){ console.error(err); alert("Couldn't delete — please try again."); }
}

loadProducts();
